name: nextstep
description: "NextStep – private HIV-prevention companion for young women (prototype). MIT licence."
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.8.0

dependencies:
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^23.0.0
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.4
  http: ^1.6.0
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  qr_flutter: ^4.1.0
  record: ^7.1.2
  timezone: ^0.11.2
  url_launcher: ^6.3.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/content/
  fonts:
    - family: Atkinson
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegible-Regular.ttf
        - asset: assets/fonts/AtkinsonHyperlegible-Bold.ttf
          weight: 700
